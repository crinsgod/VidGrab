name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build single exe
        shell: powershell
        run: .\build.ps1

      - name: Generate checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash dist\VidGrab.exe -Algorithm SHA256).Hash
          "$hash  VidGrab.exe" | Set-Content dist\SHA256SUMS.txt -Encoding ASCII
          Get-Content dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VidGrab.exe
            dist/SHA256SUMS.txt
          overwrite_files: true
          draft: false
          prerelease: false
